<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- The page may only load its own files and may only talk to its own address: data can't leave the phone. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; font-src 'self'; form-action 'none'; base-uri 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#071A1D" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F5F5F7" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Quick View">
<meta name="format-detection" content="telephone=no">
<title>Quick View</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <main id="view" tabindex="-1"></main>
  <nav id="tabs" aria-label="Sections"></nav>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="update" hidden><span>A new version of Quick View is ready.</span><button type="button" id="updateBtn">Reload</button></div>
<input type="file" id="picker" hidden>
<script src="app.js"></script>
</body>
</html>
